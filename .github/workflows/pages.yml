name: Deploy direct FW14 launcher

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "core_hx1400_lowmap.js"
      - "fw14_cleanup.js"
      - "fw14_goldhen_direct_contract.js"
      - "fw14_hx1400_goldhen_dualmap_entry.js"
      - "hx1400_data.js"
      - "hx1400_goldhen_dualmap_owner.js"
      - "hx1400_goldhen_dualmap_stage.js"
      - "hx1400_jit_dualmap_lease.js"
      - "int64.js"
      - "jb_hx1400_goldhen_dualmap.js"
      - "mem_hx1400_lowmap.js"
      - "ps4_offsets.js"
      - "sha256.js"
      - "hen.bin"
      - "GOLDHEN_LICENSES.txt"
      - "fw14_hx1400_goldhen_dualmap_static.json"
      - "github-pages/**"
      - "release-manifest.json"
      - "verify_release_manifest.py"
      - "fw14_static_graph.py"
      - "test_github_pages_direct.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify complete release manifest
        run: python -B verify_release_manifest.py --root .
      - name: Verify direct launcher contract
        run: node --test test_github_pages_direct.mjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build exact direct-launch artifact
        shell: python
        run: |
          import hashlib
          import json
          import shutil
          from pathlib import Path, PurePosixPath

          pages = Path("github-pages")
          pages_expected = {".nojekyll", "release-manifest.json"}
          pages_entries = {
              path.relative_to(pages).as_posix()
              for path in pages.rglob("*")
          }
          if pages_entries != pages_expected:
              raise SystemExit(f"unexpected Pages source entries: {sorted(pages_entries ^ pages_expected)}")

          static_path = Path("fw14_hx1400_goldhen_dualmap_static.json")
          static_manifest = json.loads(static_path.read_text(encoding="utf-8"))
          if set(static_manifest) != {"schema", "files"}:
              raise SystemExit("static manifest shape mismatch")
          if static_manifest["schema"] != "oms.fw14-hx1400-goldhen-dualmap.static.v1":
              raise SystemExit("static manifest schema mismatch")
          if not isinstance(static_manifest["files"], dict) or not static_manifest["files"]:
              raise SystemExit("static manifest files map is invalid")

          sources = {
              ".nojekyll": pages / ".nojekyll",
              "release-manifest.json": pages / "release-manifest.json",
              "fw14_hx1400_goldhen_dualmap_static.json": static_path,
              "hen.bin": Path("hen.bin"),
              "GOLDHEN_LICENSES.txt": Path("GOLDHEN_LICENSES.txt"),
          }
          for request_path in static_manifest["files"]:
              if not isinstance(request_path, str) or not request_path.startswith("/"):
                  raise SystemExit(f"invalid static request path: {request_path!r}")
              relative = PurePosixPath(request_path.removeprefix("/"))
              name = relative.as_posix()
              if not name or relative.is_absolute() or ".." in relative.parts or name in sources:
                  raise SystemExit(f"unsafe or duplicate static request path: {request_path!r}")
              sources[name] = Path(*relative.parts)
          if "index.html" not in sources:
              raise SystemExit("static graph does not contain index.html")
          for name, path in sources.items():
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"direct-launch source is not a regular file: {name}")

          manifest = json.loads(sources["release-manifest.json"].read_text(encoding="utf-8"))
          if manifest.get("schema") != "oms.fw14-goldhen-direct.release.v1":
              raise SystemExit("release manifest schema mismatch")
          hen = sources["hen.bin"].read_bytes()
          hen_digest = hashlib.sha256(hen).hexdigest()
          if len(hen) != 0x48A18 or hen_digest != manifest.get("henSha256"):
              raise SystemExit("Pages HEN pin mismatch")

          stage = Path("_site")
          stage.mkdir()
          for name, path in sources.items():
              destination = stage.joinpath(*PurePosixPath(name).parts)
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(path, destination)
          actual = {
              path.relative_to(stage).as_posix()
              for path in stage.rglob("*")
              if path.is_file()
          }
          if actual != set(sources):
              raise SystemExit(f"unexpected staged entries: {sorted(actual ^ set(sources))}")
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
