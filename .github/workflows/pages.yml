name: Deploy Pages companion

on:
  push:
    branches: [main]
    paths:
      - "github-pages/**"
      - "release-manifest.json"
      - "verify_release_manifest.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify complete release manifest
        run: python -B verify_release_manifest.py --root .
      - name: Verify Pages navigation contract
        run: node --test test_github_pages_portal.mjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build exact static-only artifact
        shell: python
        run: |
          import json
          import shutil
          from pathlib import Path

          source = Path("github-pages")
          expected = {".nojekyll", "index.html", "portal.js", "release-manifest.json"}
          entries = {
              path.relative_to(source).as_posix()
              for path in source.rglob("*")
          }
          if entries != expected:
              raise SystemExit(f"unexpected Pages entries: {sorted(entries ^ expected)}")
          for name in expected:
              path = source / name
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"Pages entry is not a regular file: {name}")
          manifest = json.loads((source / "release-manifest.json").read_text(encoding="utf-8"))
          if manifest.get("schema") != "oms.fw14-hx1400-access.release.v1":
              raise SystemExit("release manifest schema mismatch")

          stage = Path("_site")
          stage.mkdir()
          for name in expected:
              shutil.copyfile(source / name, stage / name)
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
